# .github/workflows/ 로 복사해서 사용. 기존 weekly_crawler.yml(시뮬레이션 크롤러) 대체.
name: Weekly Gift Bid Collect
on:
  schedule:
    - cron: '0 0 * * 1'   # 매주 월 09:00 KST
  workflow_dispatch:
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: 'pip' }
      - run: pip install -r requirements.txt psycopg2-binary
      - name: Collect
        env:
          G2B_SERVICE_KEY: ${{ secrets.G2B_SERVICE_KEY }}
          B2B_DB_URL: ${{ secrets.B2B_DB_URL }}
        run: python scripts/collect_bids.py --days 8
